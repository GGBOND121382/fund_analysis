name: Python tests

on:
  push:
    branches:
      - codex/fund-analysis-v1.0-risk-exits-20261111
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q fundkit tests main.py
      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
