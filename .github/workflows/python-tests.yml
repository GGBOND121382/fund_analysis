name: Python tests

on:
  push:
    branches:
      - codex/fund-analysis-v1.0-risk-exits-20261111
      - codex/fund-analysis-all-fund-ranking-20261114
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q fundkit tests scripts main.py
      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Run full four-horizon discovery audit against published data
        run: >-
          python scripts/run_fund_discovery.py
          --asof 2026-11-20
          --snapshot reports/all_funds/industry_rank_20261120
          --output artifacts/fund_discovery_20261120
      - name: Verify historical snapshot cannot fabricate investment rank
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=Path("artifacts/fund_discovery_20261120")
          audit=json.loads((d/"audit.json").read_text(encoding="utf-8"))
          assert audit["oos_acceptance"]=="EVIDENCE_INSUFFICIENT"
          assert not audit["certified_investable_ranking"]
          assert len(audit["horizons"])==4
          for h,stats in audit["horizons"].items():
              assert stats["feature_rows"]>0, h
              assert stats["experimentally_scored"]==0, h
              assert stats["historical_return_candidates"]>0, h
              assert (d/f"research_{h}.csv").exists()
              assert (d/f"top10_historical_return_DIAGNOSTIC_{h}.csv").exists()
          import pandas as pd
          for h in ("5y","3y","1y","6m"):
              hist=pd.read_csv(d/f"top10_historical_return_DIAGNOSTIC_{h}.csv")
              assert 0 < len(hist) <= 10
              assert hist.historical_return_cagr.notna().all()
              assert hist.descriptive_research_status.eq("NAV_HISTORY_ONLY").all()
              assert (hist.risk_comparability!="REPRODUCIBLE_ECONOMIC_RISK").all()
              assert pd.read_csv(d/f"top10_experimental_{h}.csv").empty
          r=pd.read_csv(d/"research_1y.csv",dtype={"code":str})
          for code in ("007589","008693","007680","008338"):
              hit=r.loc[r.code.eq(code)]
              assert len(hit)==1, code
              assert bool(hit.contract_review_hint.iloc[0]), code
              assert hit.score_annual.isna().all(), code
              assert hit.buyable_now.eq(False).all(), code
          PY
      - name: Preserve discovery diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: fund-discovery-20261120-diagnostic
          path: artifacts/fund_discovery_20261120
          retention-days: 30
