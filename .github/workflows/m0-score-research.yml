name: M0 score research
on:
  push:
    branches:
      - codex/fund-analysis-all-fund-ranking-20261114
    paths:
      - 'fundkit/m0_score_research.py'
      - 'scripts/run_m0_score_research.py'
      - 'tests/test_m0_score_research.py'
      - '.github/workflows/m0-score-research.yml'
  workflow_dispatch:
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p test_m0_score_research.py -v
      - run: python scripts/run_m0_score_research.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m0-score-research-20261128
          path: artifacts/m0_score_research_20261128
          retention-days: 30
