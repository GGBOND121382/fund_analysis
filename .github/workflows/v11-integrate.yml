name: Integrate pinned v1.1 B6 research branch
on:
  push:
    branches:
      - codex/fund-analysis-v1.1-dynamic-b6-20261111
    paths:
      - 'v11_upload/**'
      - 'scripts/v11_apply_staged.py'
      - '.github/workflows/v11-integrate.yml'
permissions:
  contents: write
jobs:
  install-test-commit:
    if: github.repository == 'GGBOND121382/fund_analysis'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unpack pinned source and integrate
        run: python scripts/v11_apply_staged.py
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run all existing and B6 tests
        run: python -m unittest discover -s tests -p 'test_*.py' -q
      - name: Commit tested source on research branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fundkit config/policy_params.json scripts/install_v11_overlay.py tests/test_v11.py tests/test_joint_optimizer.py docs/V11_B6_OVERLAY.md
          if ! git diff --cached --quiet; then
            git commit -m "feat: integrate verified B6 source from pinned v1.1 bundle"
            git push origin HEAD:codex/fund-analysis-v1.1-dynamic-b6-20261111
          fi
