name: Independent M0-M7 ablation replay
on:
  push:
    branches:
      - codex/fund-analysis-all-fund-ranking-20261114
    paths:
      - 'scripts/audit_debug_data_20261127.py'
      - 'fundkit/model_ablation.py'
      - 'scripts/rank_models_m123.py'
      - 'scripts/run_oos_model_comparison.py'
      - 'tests/test_model_ablation.py'
      - '.github/workflows/debug-data-replay.yml'
  workflow_dispatch:
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p test_model_ablation.py -v
      - run: python scripts/audit_debug_data_20261127.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m0-m7-ablation-20261128
          path: artifacts/debug_ablation_20261128
          retention-days: 30
